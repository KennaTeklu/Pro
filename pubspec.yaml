name: pro_workout_app
description: A comprehensive workout tracking app with longevity focus
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI & Charts
  fl_chart: ^0.68.0
  # Storage
  shared_preferences: ^2.2.3
  # File picking
  file_picker: ^8.0.0+1
  # Date formatting
  intl: ^0.19.0
  # State management
  provider: ^6.1.2
  # URL launcher (for web search)
  url_launcher: ^6.2.5
  # SVG support (optional for icons)
  flutter_svg: ^2.0.10+1
  # For animations
  animations: ^2.0.11
  # For notifications (local)
  flutter_local_notifications: ^17.1.2
  # For theming
  flex_color_scheme: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # If you have assets like sample data or icons, add them here
  # assets:
  #   - assets/sample_data.json